services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build:
      context: ./ingestion
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017/traceflow
      REDIS_URL: redis://redis:6379
      INGESTION_PORT: 4000
    ports:
      - "4000:4000"
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10

  demo-app:
    build:
      context: ./demo-app
    restart: unless-stopped
    environment:
      PORT: 3000
      TRACEFLOW_INGESTION_URL: http://ingestion:4000/ingest
    ports:
      - "3000:3000"
    depends_on:
      ingestion:
        condition: service_healthy

  dashboard:
    build:
      context: ./waterfall-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      ingestion:
        condition: service_healthy

volumes:
  mongo-data:
    name: traceflow-mongo-data
